name: Remote Device Manager
config_version: 2

# Workflows
workflows:
  android-workflow:
    name: Android Build
    working_directory: android-app
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        CM_KEYSTORE_PATH: rdm-release.keystore
        CM_KEYSTORE_PASSWORD: rdmStorePass2024!
        CM_KEY_ALIAS: rdm
        CM_KEY_PASSWORD: rdmStorePass2024!
    scripts:
      - ./gradlew assembleDebug
      - ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
      # Uncomment and configure if you want to publish to Google Play
      # google_play:
      #   track: internal
      #   submit_as_draft: true
