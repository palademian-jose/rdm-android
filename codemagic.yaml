name: Remote Device Manager
config_version: 2

# Workflows
workflows:
  android-workflow:
    name: Android Build
    working_directory: android-app
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      android_signing:
        - keystore_reference: rdm-keystore
      vars:
        KEYSTORE_ALIAS: rdm
        KEYSTORE_PASSWORD: $CM_KEYSTORE_PASSWORD
        KEY_PASSWORD: $CM_KEY_PASSWORD
    scripts:
      - name: Build Debug APK
        test: false
        script: |
          ./gradlew assembleDebug
      - name: Build Release APK
        test: false
        script: |
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
      # Uncomment and configure if you want to publish to Google Play
      # google_play:
      #   track: internal
      #   submit_as_draft: true
